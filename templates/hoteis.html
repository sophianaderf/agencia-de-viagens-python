{% extends 'base.html' %}
{% block content %}
<div class="card">
    <h2>Hotéis Cadastrados</h2>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Hotel</th>
                    <th>Endereço</th>
                    <th>Telefone</th>
                    <th>Destino (Cidade)</th>
                </tr>
            </thead>
            <tbody>
                {% for h in hoteis %}
                <tr>
                    <td>{{ h[0] }}</td>
                    <td>{{ h[1] }}</td>
                    <td>{{ h[2] }}</td>
                    <td>{{ h[3] }}</td>
                    <td>{{ h[4] or 'Não associado' }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
