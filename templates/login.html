<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Agência de Viagens</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=7) }}">
</head>
<body class="login-body">
    {% with mensagens = get_flashed_messages(with_categories=true) %}
        {% if mensagens %}
            <div class="mensagens-flash login-mensagens">
                {% for categoria, mensagem in mensagens %}
                    <div class="mensagem {{ categoria }}">{{ mensagem }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <main class="login-page">
        <section class="login-card" aria-labelledby="login-titulo">
            <div class="login-brand">
                <span class="brand-mark"></span>
                <span>TRAVEL</span>
            </div>
            <p class="section-kicker">Acesso restrito</p>
            <h1 id="login-titulo">Área de funcionários</h1>
            <p class="login-description">Entre com suas credenciais para acessar o sistema.</p>

            <form class="login-form" method="post">
                <label for="usuario">Usuário</label>
                <input id="usuario" name="usuario" autocomplete="username" required autofocus>

                <label for="senha">Senha</label>
                <input id="senha" name="senha" type="password" autocomplete="current-password" required>

                <button class="primary-button" type="submit">Entrar</button>
            </form>
        </section>
    </main>

    <script>
        document.querySelectorAll('.mensagens-flash .mensagem').forEach((mensagem) => {
            window.setTimeout(() => {
                mensagem.classList.add('mensagem-saindo');
                window.setTimeout(() => mensagem.remove(), 300);
            }, 4000);
        });
    </script>
</body>
</html>
