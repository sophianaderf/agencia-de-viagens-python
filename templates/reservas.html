{% extends 'base.html' %}
{% block content %}
<div class="card">
    <h2>Reservas de Viagem</h2>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Data</th>
                    <th>Qtd Pessoas</th>
                    <th>Cliente</th>
                    <th>Pacote</th>
                    <th>Agente Responsável</th>
                </tr>
            </thead>
            <tbody>
                {% for r in reservas %}
                <tr>
                    <td>{{ r.id }}</td>
                    <td>{{ r.data_reserva }}</td>
                    <td>{{ r.quantidade_pessoas }}</td>
                    <td>{{ r.cliente_nome }}</td>
                    <td>{{ r.nome_pacote }}</td>
                    <td>{{ r.func_nome }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
